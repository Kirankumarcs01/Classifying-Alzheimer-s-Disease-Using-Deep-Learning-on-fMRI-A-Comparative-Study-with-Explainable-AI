<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .bar { rx: 12; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="title">Model Accuracy Comparison</text>

  <g transform="translate(160,120)">
    <line x1="0" y1="470" x2="860" y2="470" stroke="#94a3b8" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="470" stroke="#94a3b8" stroke-width="2"/>

    <g opacity="0.6" stroke="#e2e8f0" stroke-width="1">
      <line x1="0" y1="470" x2="860" y2="470"/>
      <line x1="0" y1="376" x2="860" y2="376"/>
      <line x1="0" y1="282" x2="860" y2="282"/>
      <line x1="0" y1="188" x2="860" y2="188"/>
      <line x1="0" y1="94" x2="860" y2="94"/>
    </g>

    <g class="label">
      <text x="-15" y="474" text-anchor="end">0</text>
      <text x="-15" y="380" text-anchor="end">20</text>
      <text x="-15" y="286" text-anchor="end">40</text>
      <text x="-15" y="192" text-anchor="end">60</text>
      <text x="-15" y="98" text-anchor="end">80</text>
      <text x="-15" y="12" text-anchor="end">100</text>
      <text x="430" y="560" text-anchor="middle">Models</text>
      <text x="-85" y="220" transform="rotate(-90 -85 220)" text-anchor="middle">Accuracy (%)</text>
    </g>

    <g>
      <rect x="40" y="215" width="80" height="255" fill="#2563eb" class="bar"/>
      <rect x="150" y="280" width="80" height="190" fill="#f59e0b" class="bar"/>
      <rect x="260" y="310" width="80" height="160" fill="#10b981" class="bar"/>
      <rect x="370" y="320" width="80" height="150" fill="#ef4444" class="bar"/>
      <rect x="480" y="345" width="80" height="125" fill="#8b5cf6" class="bar"/>
      <rect x="590" y="367" width="80" height="103" fill="#14b8a6" class="bar"/>
    </g>

    <g class="label">
      <text x="80" y="495" text-anchor="middle">SVM</text>
      <text x="190" y="495" text-anchor="middle">BiLSTM</text>
      <text x="300" y="495" text-anchor="middle">GCN</text>
      <text x="410" y="495" text-anchor="middle">Fusion</text>
      <text x="520" y="495" text-anchor="middle">RF</text>
      <text x="630" y="495" text-anchor="middle">AUC</text>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#0f172a">
      <text x="80" y="200" text-anchor="middle">71.3%</text>
      <text x="190" y="265" text-anchor="middle">69.3%</text>
      <text x="300" y="295" text-anchor="middle">66.4%</text>
      <text x="410" y="305" text-anchor="middle">67.1%</text>
      <text x="520" y="330" text-anchor="middle">64.8%</text>
      <text x="630" y="352" text-anchor="middle">77.7%</text>
    </g>
  </g>
</svg>

