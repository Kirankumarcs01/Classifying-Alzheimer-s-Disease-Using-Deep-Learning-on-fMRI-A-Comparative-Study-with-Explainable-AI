<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .cell { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" class="title">Confusion Matrix</text>

  <g transform="translate(220,120)">
    <rect x="0" y="0" width="260" height="260" fill="#ffffff" stroke="#cbd5e1" rx="12"/>
    <rect x="0" y="0" width="130" height="130" fill="#dbeafe" class="cell"/>
    <rect x="130" y="0" width="130" height="130" fill="#e0f2fe" class="cell"/>
    <rect x="0" y="130" width="130" height="130" fill="#fee2e2" class="cell"/>
    <rect x="130" y="130" width="130" height="130" fill="#dcfce7" class="cell"/>

    <text x="65" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">68</text>
    <text x="195" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">12</text>
    <text x="65" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">15</text>
    <text x="195" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#16a34a">41</text>

    <text x="65" y="-12" text-anchor="middle" class="label">Actual AD</text>
    <text x="195" y="-12" text-anchor="middle" class="label">Actual CN</text>
    <text x="-36" y="72" text-anchor="middle" transform="rotate(-90 -36 72)" class="label">Predicted AD</text>
    <text x="-36" y="202" text-anchor="middle" transform="rotate(-90 -36 202)" class="label">Predicted CN</text>

    <text x="420" y="70" class="label">Best Model: SVM Linear</text>
    <text x="420" y="120" class="label">Accuracy: 71.3%</text>
    <text x="420" y="170" class="label">AUC: 0.777</text>
  </g>
</svg>

